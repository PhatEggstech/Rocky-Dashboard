services:
  # --- Backend API ---
  edp-api:
    build:
      context: .
      dockerfile: ./executive_dashboard/Dockerfile
    container_name: rocky-edp-api
    ports:
      - "8000:8000"
    environment:
      - EDP_CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - DASHBOARD_PG_DSN=postgresql://${WAREHOUSE_POSTGRES_USER:-hmk}:${WAREHOUSE_POSTGRES_PASSWORD:?Set WAREHOUSE_POSTGRES_PASSWORD}@warehouse-pg:5432/${WAREHOUSE_POSTGRES_DB:-hmk_warehouse}
      - WAREHOUSE_PG_DSN=postgresql://${WAREHOUSE_POSTGRES_USER:-hmk}:${WAREHOUSE_POSTGRES_PASSWORD:?Set WAREHOUSE_POSTGRES_PASSWORD}@warehouse-pg:5432/${WAREHOUSE_POSTGRES_DB:-hmk_warehouse}
      - POS_PG_DSN=${POS_PG_DSN:-}
      - WMS_PG_DSN=${WMS_PG_DSN:-}
      - POS_SYNC_ON_STARTUP=0
      - WMS_SYNC_ON_STARTUP=0
    volumes:
      - edp-data:/app/data
    depends_on:
      warehouse-pg:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- Frontend (Nginx + SPA) ---
  edp-web:
    build:
      context: ./executive_dashboard_frontend
      dockerfile: Dockerfile
    container_name: rocky-edp-web
    ports:
      - "3000:80"
    depends_on:
      edp-api:
        condition: service_healthy
    restart: unless-stopped

  # --- Warehouse PostgreSQL (Lakehouse Gold layer) ---
  warehouse-pg:
    image: postgres:16-alpine
    container_name: rocky-warehouse-pg
    environment:
      POSTGRES_USER: ${WAREHOUSE_POSTGRES_USER:-hmk}
      POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD:?Set WAREHOUSE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${WAREHOUSE_POSTGRES_DB:-hmk_warehouse}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./datalake/ddl:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmk -d hmk_warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- MinIO (Parquet archive) ---
  minio:
    image: minio/minio:latest
    container_name: rocky-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # --- Metabase (BI tool for data verification) ---
  metabase:
    image: metabase/metabase:latest
    container_name: rocky-metabase
    ports:
      - "3001:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: hmk_warehouse
      MB_DB_PORT: 5432
      MB_DB_USER: hmk
      MB_DB_PASS: hmk_warehouse
      MB_DB_HOST: warehouse-pg
    depends_on:
      warehouse-pg:
        condition: service_healthy
    restart: unless-stopped

volumes:
  edp-data:
    driver: local
  warehouse_data:
    driver: local
  minio_data:
    driver: local
